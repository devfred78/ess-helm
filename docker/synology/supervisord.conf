[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Les sorties des services sont envoyées vers la sortie du conteneur afin
# d'apparaître dans le journal Docker de DSM.

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:synapse]
command=python3 -m synapse.app.homeserver -c /data/config/homeserver.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mas]
command=/usr/local/bin/mas-cli server --config /data/config/mas.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /data/config/Caddyfile --adapter caddyfile
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
