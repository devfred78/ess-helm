[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Les sorties des services sont envoyées vers la sortie du conteneur afin
# d'apparaître dans le journal Docker de DSM.

[program:postgresql]
# Utilise la configuration du cluster persistant (/data/postgres/postgresql.conf), comme
# l'entrypoint. Ne pas pointer vers /etc/postgresql/16/main : son data_directory
# (/var/lib/postgresql/16/main) l'emporterait sur -D.
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres -k /var/run/postgresql -c listen_addresses=127.0.0.1
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:synapse]
command=python3 -m synapse.app.homeserver -c /data/config/homeserver.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mas]
command=/usr/local/bin/mas-cli server --config /data/config/mas.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# Services d'appels audio/vidéo, démarrés selon ENABLE_MATRIX_RTC et ENABLE_TURN
# (normalisées en true/false par l'entrypoint)

[program:livekit]
command=/usr/local/bin/livekit-server --config /data/config/livekit.yaml
user=root
autostart=%(ENV_ENABLE_MATRIX_RTC)s
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:lk-jwt-service]
# MatrixRTC Authorisation Service. Il interroge Synapse au démarrage : on tolère
# quelques échecs le temps que Synapse soit prêt.
command=/usr/local/bin/lk-jwt-service
environment=LIVEKIT_JWT_BIND="127.0.0.1:8082",LIVEKIT_URL="%(ENV_LIVEKIT_PUBLIC_URL)s",LIVEKIT_KEY="%(ENV_LIVEKIT_KEY)s",LIVEKIT_SECRET_FROM_FILE="/data/secrets/livekit_secret",LIVEKIT_FULL_ACCESS_HOMESERVERS="%(ENV_SERVER_NAME)s",LIVEKIT_CS_API_URL_OVERRIDES="%(ENV_SERVER_NAME)s=http://127.0.0.1:8008",LIVEKIT_AS_REGISTRATION_FILE="/data/config/matrix-rtc-registration.yaml",LIVEKIT_HS_SERVER_NAME="%(ENV_SERVER_NAME)s"
user=root
autostart=%(ENV_ENABLE_MATRIX_RTC)s
autorestart=true
startretries=20
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:coturn]
command=turnserver -c /data/config/turnserver.conf
user=root
autostart=%(ENV_ENABLE_TURN)s
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /data/config/Caddyfile --adapter caddyfile
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
