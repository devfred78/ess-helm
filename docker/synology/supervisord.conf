[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

[program:synapse]
command=python3 -m synapse.app.homeserver -c /data/config/homeserver.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/synapse.log
stderr_logfile=/var/log/supervisor/synapse_err.log

[program:mas]
command=/usr/local/bin/mas-cli server --config /data/config/mas.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/mas.log
stderr_logfile=/var/log/supervisor/mas_err.log

[program:caddy]
command=caddy run --config /data/config/Caddyfile --adapter caddyfile
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/caddy.log
stderr_logfile=/var/log/supervisor/caddy_err.log
