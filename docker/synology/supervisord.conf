[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Les sorties des services sont envoyées vers la sortie du conteneur afin
# d'apparaître dans le journal Docker de DSM.

[program:postgresql]
# Utilise la configuration du cluster persistant (/data/postgres/postgresql.conf), comme
# l'entrypoint. Ne pas pointer vers /etc/postgresql/16/main : son data_directory
# (/var/lib/postgresql/16/main) l'emporterait sur -D.
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres -k /var/run/postgresql -c listen_addresses=127.0.0.1
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:synapse]
command=python3 -m synapse.app.homeserver -c /data/config/homeserver.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mas]
command=/usr/local/bin/mas-cli server --config /data/config/mas.yaml
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /data/config/Caddyfile --adapter caddyfile
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
