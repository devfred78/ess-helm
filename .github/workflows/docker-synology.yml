name: Build and publish ESS Synology Docker image

on:
  pull_request:
    paths:
      - 'docker/synology/**'
      - '.github/workflows/docker-synology.yml'
      - 'docker-bake.hcl'
  push:
    branches:
      - main
      - 'maintenance/*'
    tags:
      - 'synology-*'
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/ess-synology

permissions:
  contents: read

jobs:
  docker-build-and-push:
    permissions:
      contents: read
      packages: write
    name: Build ESS Synology container image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata extraction
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Element Server Suite Community - Synology Edition
            org.opencontainers.image.description=All-in-one container for Element Server Suite Community on Synology DSM
            org.opencontainers.image.licenses=AGPL-3.0-only
          annotations: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and Push Multi-arch Docker Image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f  # v7.4.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          files: |
            docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: ess-synology
          set: |
            *.platform=linux/amd64,linux/arm64
          no-cache: ${{ github.event_name != 'pull_request' }}
